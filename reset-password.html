<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Reset password | Bartind'r</title>

    <meta
      name="description"
      content="Open Bartind'r to choose a new password."
    />

    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at top,
            rgba(78, 203, 177, 0.18),
            transparent 36%
          ),
          #101414;
        color: #ffffff;
      }

      .card {
        width: 100%;
        max-width: 520px;
        padding: 40px 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        background: rgba(24, 30, 30, 0.94);
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(78, 203, 177, 0.16);
        font-size: 34px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(28px, 6vw, 38px);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 17px;
        line-height: 1.6;
      }

      .actions {
        margin-top: 30px;
        display: grid;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        padding: 14px 20px;
        border: 0;
        border-radius: 14px;
        background: #4ecbb1;
        color: #08110f;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .button-secondary {
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: transparent;
        color: #ffffff;
      }

      .status {
        min-height: 22px;
        margin-top: 22px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        line-height: 1.5;
      }

      .status-error {
        color: #ffb4ab;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">🔒</div>

      <h1>Reset your password</h1>

      <p>
        Open Bartind'r to choose a new password for your account.
      </p>

      <div class="actions">
        <a id="open-app-button" class="button" href="#">
          Open Bartind'r
        </a>

        <a class="button button-secondary" href="./">
          Return to the Bartind'r website
        </a>
      </div>

      <div id="status" class="status">
        Preparing your secure password reset…
      </div>
    </main>

    <script>
      const statusElement = document.getElementById("status");
      const openAppButton = document.getElementById("open-app-button");

      let appLaunchAttempted = false;

      function getRecoveryParameters() {
        const search = window.location.search || "";
        const hash = window.location.hash || "";

        return `${search}${hash}`;
      }

      function hasRecoveryInformation() {
        const recoveryParameters = getRecoveryParameters();

        return (
          recoveryParameters.includes("access_token=") ||
          recoveryParameters.includes("refresh_token=") ||
          recoveryParameters.includes("code=") ||
          recoveryParameters.includes("token_hash=")
        );
      }

      function buildAppUrl() {
        const recoveryParameters = getRecoveryParameters();

        return `bartender-match://reset-password${recoveryParameters}`;
      }

      function openBartindr() {
        if (appLaunchAttempted) {
          return;
        }

        if (!hasRecoveryInformation()) {
          statusElement.classList.add("status-error");
          statusElement.textContent =
            "This password reset link is incomplete or expired. Request a new link from Bartind'r.";
          return;
        }

        appLaunchAttempted = true;

        statusElement.classList.remove("status-error");
        statusElement.textContent = "Attempting to open Bartind'r…";

        window.location.href = buildAppUrl();

        window.setTimeout(() => {
          appLaunchAttempted = false;

          statusElement.textContent =
            "If the app did not open, tap “Open Bartind'r” or open it manually.";
        }, 1800);
      }

      openAppButton.addEventListener("click", (event) => {
        event.preventDefault();
        openBartindr();
      });

      window.setTimeout(openBartindr, 500);
    </script>
  </body>
</html>
